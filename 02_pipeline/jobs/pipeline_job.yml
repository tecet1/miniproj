# Databricks Asset Bundle 리소스 정의: 상시 스트림 3개 + 주기 대조 (계획 07 카드 7-F). 미검증: 아직 배포한 적 없다.
# 트리거 간격은 노트북이 02_pipeline/pipeline_config.json에서 읽는다 (이 파일에는 두지 않는다).
# [배포] bundle의 databricks.yml에서 이 파일을 include하고 cluster_id를 사용자의 All-purpose 클러스터로 채운다.
#   노트북 경로는 Git folder 기준 상대 경로다. 클러스터 접근 모드는 서비스 자격 증명(Event Hubs)이 되는 모드여야 한다.
# [재시작] 스트림 태스크는 끝나지 않는 노트북이다. 실패하면 Job이 다시 시작하고 체크포인트가 이어서 읽는다 (max_retries -1은 무한).
resources:
  jobs:
    commerce_pipeline_streams:
      name: commerce-pipeline-streams
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_stream
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../bronze/stream_bronze
          max_retries: -1
          min_retry_interval_millis: 30000
        - task_key: silver_stream
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../silver/stream_silver
          max_retries: -1
          min_retry_interval_millis: 30000
        - task_key: gold_stream
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../gold/stream_gold
          max_retries: -1
          min_retry_interval_millis: 30000
      email_notifications:
        on_failure: []   # 실행 모니터링은 승인 범위 밖이다. 알림이 필요하면 사용자가 주소를 넣는다

    commerce_pipeline_reconcile:
      name: commerce-pipeline-reconcile
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"   # pipeline_config.json의 reconcile_schedule과 같아야 한다 (테스트가 확인)
        timezone_id: Asia/Seoul
      tasks:
        - task_key: reconcile
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../quality/run_reconcile
